<style>
  :root {
    --bg-corner: #01060D;
    --bg-center: #030C16;
    --bg-deeper: #050F1C;
    --cyan: #00D2FF;
    --cyan-dim: #102E42;
    --cyan-soft: #D9EFFF;
    --copper: #C79F64;
    --copper-bright: #E5C28A;
    --white: #FFFFFF;
    --muted: #6B8AA3;
    --panel: rgba(8, 18, 32, 0.55);
    --panel-edge: rgba(0, 210, 255, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: var(--bg-corner);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, var(--bg-center) 0%, var(--bg-deeper) 40%, var(--bg-corner) 100%);
    min-height: 100vh;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 210, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 210, 255, 0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, #000 30%, transparent 80%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 100% 80% at 50% 50%, transparent 40%, rgba(1, 6, 13, 0.7) 100%);
    pointer-events: none;
    z-index: 1;
  }

  #root { position: relative; z-index: 2; min-height: 100vh; }

  ::selection { background: rgba(0, 210, 255, 0.35); color: #fff; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0, 210, 255, 0.4); }

  /* === styles.css === */
  :root {
    --brand-bg: #01060D;
  }

  body {
    background: #FFFFFF !important;
  }
  body::before, body::after { display: none !important; }

  .auth-page.minimal {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
    color: #0F1620;
  }

  .auth-main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 2fr;
    min-height: 100vh;
    position: relative;
  }

  .auth-left {
    background:
      radial-gradient(ellipse 90% 70% at 50% 50%, #0F2438 0%, #0A1B2C 50%, #061320 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    position: relative;
    overflow: hidden;
  }

  .branding-panel {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .brand-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.22em;
    color: #fff;
    text-shadow:
      0 0 18px rgba(0, 210, 255, 0.4),
      0 0 40px rgba(0, 210, 255, 0.15);
    white-space: nowrap;
  }
  .brand-word-aero, .brand-word-tech { color: #fff; }
  .brand-word-ring { color: var(--cyan); text-shadow: 0 0 14px var(--cyan); }
  .brand-divider {
    width: 5px; height: 5px;
    background: var(--copper);
    transform: rotate(45deg);
    box-shadow: 0 0 8px var(--copper);
  }

  .brand-tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.45em;
    color: var(--copper);
    text-shadow: 0 0 10px rgba(199, 159, 100, 0.3);
    padding-top: 6px;
  }

  .auth-right {
    background:
      radial-gradient(ellipse 80% 60% at 30% 20%, #EAF4FA 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 90%, #F2EBDD 0%, transparent 55%),
      linear-gradient(180deg, #F4F8FB 0%, #ECF2F7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 40px 28px;
    position: relative;
  }

  .form-panel-outer {
    flex: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    padding-bottom: 40px;
  }

  .form-panel {
    width: 100%;
    background: transparent;
    border: none;
    padding: 0;
  }

  .mform-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: 0.01em;
    color: #1A2330;
    margin: 0 0 4px 0;
  }
  .mform-sub {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    color: #64748B;
    margin: 0 0 28px 0;
    letter-spacing: 0.01em;
  }

  .mform {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .mfield-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .mfield-wrap {
    position: relative;
    background: rgba(255, 255, 255, 0.9);
    border: 1.5px solid #D6E0EA;
    border-radius: 8px;
    height: 52px;
    display: flex;
    align-items: stretch;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .mfield-wrap:hover { border-color: #B5C6D6; }
  .mfield.is-focus .mfield-wrap {
    border-color: var(--cyan);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.12), 0 4px 14px rgba(0, 210, 255, 0.08);
  }

  .mfield-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    color: #94A3B8;
    flex: 0 0 auto;
    border-right: 1px solid #E2EAF2;
    transition: color 0.2s, border-color 0.2s;
  }
  .mfield.is-focus .mfield-icon {
    color: var(--cyan);
    border-right-color: rgba(0, 210, 255, 0.25);
  }

  .mfield input, .mfield select {
    flex: 1;
    height: 100%;
    border: none;
    background: transparent;
    outline: none;
    padding: 0 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #1A2330;
    min-width: 0;
  }
  .mfield input::placeholder { color: #94A3B8; opacity: 1; }
  .mfield select { appearance: none; cursor: pointer; padding-right: 36px; color: #1A2330; }
  .mfield select:invalid, .mfield.is-filled select { color: #1A2330; }
  .mfield select option { color: #1A2330; }
  .mfield-chevron {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #94A3B8;
    font-size: 12px;
    pointer-events: none;
    transition: color 0.2s, transform 0.2s;
  }
  .mfield.is-focus .mfield-chevron { color: var(--cyan); transform: translateY(-50%) rotate(180deg); }

  .mselect { position: relative; }
  .mselect-trigger {
    width: 100%;
    cursor: pointer;
    text-align: left;
    font-family: 'Rajdhani', sans-serif;
  }
  .mselect-value {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #1A2330;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mselect-value.is-placeholder { color: #94A3B8; }

  .mselect.is-open .mfield-wrap {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-bottom-color: rgba(0, 210, 255, 0.25);
  }

  .mselect-menu {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin: 0;
    padding: 4px;
    list-style: none;
    background: #fff;
    border: 1.5px solid var(--cyan);
    border-top: none;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 210, 255, 0.12), 0 4px 12px rgba(15, 36, 56, 0.08);
    z-index: 20;
    max-height: 240px;
    overflow-y: auto;
    animation: mselectIn 0.18s ease;
  }
  @keyframes mselectIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .mselect-option {
    padding: 10px 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    color: #1A2330;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.12s, color 0.12s;
  }
  .mselect-option:hover { background: rgba(0, 210, 255, 0.08); color: var(--cyan); }
  .mselect-option.is-active {
    background: rgba(0, 210, 255, 0.12);
    color: var(--cyan);
    font-weight: 600;
  }
  .mfield-eye {
    background: transparent;
    border: none;
    cursor: pointer;
    color: #94A3B8;
    padding: 0 14px;
    display: flex;
    align-items: center;
    transition: color 0.2s;
  }
  .mfield-eye:hover { color: var(--cyan); }

  .mform-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
    margin-bottom: 4px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .mcheckbox {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    user-select: none;
    font-size: 13.5px;
    color: #475569;
    font-family: 'Rajdhani', sans-serif;
    white-space: nowrap;
  }
  .mcheckbox input { display: none; }
  .mcheck-box {
    width: 18px; height: 18px;
    border: 1.5px solid #CBD5E0;
    background: #fff;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .mcheck-mark {
    color: #fff;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.2s, transform 0.2s;
    display: flex;
    align-items: center;
  }
  .mcheckbox input:checked + .mcheck-box {
    background: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 2px 6px rgba(0, 210, 255, 0.35);
  }
  .mcheckbox input:checked + .mcheck-box .mcheck-mark { opacity: 1; transform: scale(1); }
  .mcheckbox:hover .mcheck-box { border-color: var(--cyan); }

  .mlink-cyan {
    background: transparent;
    border: none;
    color: var(--cyan);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    padding: 0;
    transition: opacity 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .mlink-cyan:hover { opacity: 0.85; text-decoration: underline; }

  .mbtn {
    position: relative;
    margin-top: 10px;
    width: 100%;
    height: 52px;
    background: linear-gradient(135deg, var(--cyan) 0%, #0099C8 100%);
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.25s ease;
    box-shadow:
      0 4px 14px rgba(0, 210, 255, 0.35),
      0 1px 2px rgba(0, 0, 0, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    overflow: hidden;
    isolation: isolate;
  }
  .mbtn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #2EE0FF 0%, var(--cyan) 50%, #0099C8 100%);
    opacity: 0;
    transition: opacity 0.3s;
    z-index: -1;
  }
  .mbtn:hover::before { opacity: 1; }
  .mbtn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 8px 24px rgba(0, 210, 255, 0.5),
      0 2px 6px rgba(0, 0, 0, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .mbtn:active { transform: translateY(0); }
  .mbtn:disabled { cursor: wait; opacity: 0.85; }

  .mbtn-content {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    z-index: 2;
  }
  .mbtn-arrow {
    display: inline-flex;
    align-items: center;
    transition: transform 0.25s ease;
  }
  .mbtn:hover .mbtn-arrow { transform: translateX(4px); }

  .mbtn-shine {
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(115deg,
      transparent 0%,
      rgba(255, 255, 255, 0) 30%,
      rgba(255, 255, 255, 0.5) 50%,
      rgba(255, 255, 255, 0) 70%,
      transparent 100%);
    transform: skewX(-20deg);
    transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    z-index: 1;
  }
  .mbtn:hover .mbtn-shine { left: 120%; }

  .mbtn-spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: mspin 0.8s linear infinite;
  }
  @keyframes mspin { to { transform: rotate(360deg); } }

  .mform-bottom {
    margin-top: 18px;
    text-align: center;
    font-size: 13.5px;
    color: #64748B;
    font-family: 'Rajdhani', sans-serif;
    white-space: nowrap;
  }

  .lang-bar {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 16px 0 4px;
  }
  .lang-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .lang-flag {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 3px 5px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
    filter: saturate(0.85);
    opacity: 0.75;
  }
  .lang-flag:hover {
    opacity: 1;
    filter: saturate(1.1);
    transform: translateY(-1px);
  }
  .lang-flag.active {
    opacity: 1;
    filter: saturate(1.1);
    border-color: var(--cyan);
    box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.15);
  }

  @media (max-width: 900px) {
    .auth-main { grid-template-columns: 1fr; }
    .auth-left { padding: 40px 20px; min-height: 280px; }
    .auth-right { padding: 30px 20px; }
    .form-panel-outer { padding-bottom: 20px; }
  }
  @media (max-width: 480px) {
    .mfield-grid-2 { grid-template-columns: 1fr; }
    .mform-title { font-size: 26px; }
  }
</style>
</head>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

const TextField = ({ placeholder, name, type = 'text', icon, value, onChange, autoComplete, required }) => {
  const [focused, setFocused] = React.useState(false);
  const [show, setShow] = React.useState(false);
  const isPass = type === 'password';
  const realType = isPass && show ? 'text' : type;

  return (
    <div className={`mfield ${focused ? 'is-focus' : ''} ${value ? 'is-filled' : ''}`}>
      <div className="mfield-wrap">
        <span className="mfield-icon"><Icon name={icon} size={18} /></span>
        <input
          id={name}
          name={name}
          type={realType}
          value={value}
          onChange={onChange}
          placeholder={placeholder + (required ? ' *' : '')}
          autoComplete={autoComplete}
          onFocus={() => setFocused(true)}
          onBlur={() => setFocused(false)}
        />
        {isPass && (
          <button type="button" className="mfield-eye" onClick={() => setShow(s => !s)} tabIndex={-1} aria-label="prikaži lozinku">
            <Icon name={show ? 'eye-off' : 'eye'} size={16} />
          </button>
        )}
      </div>
    </div>
  );
};

const SelectField = ({ placeholder, name, icon, value, onChange, options, required }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);

  const choose = (v) => {
    onChange({ target: { value: v } });
    setOpen(false);
  };

  return (
    <div ref={ref} className={`mfield mselect ${open ? 'is-focus is-open' : ''} ${value ? 'is-filled' : ''}`}>
      <button
        type="button"
        className="mfield-wrap mselect-trigger"
        onClick={() => setOpen(o => !o)}
        aria-haspopup="listbox"
        aria-expanded={open}
        id={name}
      >
        <span className="mfield-icon"><Icon name={icon} size={18} /></span>
        <span className={`mselect-value ${value ? '' : 'is-placeholder'}`}>
          {value || (placeholder + (required ? ' *' : ''))}
        </span>
        <span className="mfield-chevron">▾</span>
      </button>
      {open && (
        <ul className="mselect-menu" role="listbox">
          {options.map(o => (
            <li
              key={o}
              role="option"
              aria-selected={value === o}
              className={`mselect-option ${value === o ? 'is-active' : ''}`}
              onClick={() => choose(o)}
            >
              {o}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
};

      <div className="mform-bottom">
        <span>{t.haveAccount}</span>{' '}
        <button type="button" className="mlink-cyan" onClick={onSwitch}>{t.login}</button>
      </div>
    </form>
  );
};

const FormPanel = ({ mode, setMode, lang }) => {
  const t = T[lang] || T.sr;
  return (
    <div className="form-panel-outer">
      <div className="form-panel">
        <h1 className="mform-title">{mode === 'login' ? t.loginTitle : t.registerTitle}</h1>
        <p className="mform-sub">{mode === 'login' ? (t.loginSub || 'Pristup vašem nalogu') : (t.registerSub || 'Otvorite novi nalog')}</p>
        <div className="form-body">
          {mode === 'login'
            ? <LoginForm onSwitch={() => setMode('register')} t={t} />
            : <RegisterForm onSwitch={() => setMode('login')} t={t} />}
        </div>
      </div>
    </div>
  );
};

// ─── app.jsx ─────────────────────────────────────────────────────────────────

const TWEAK_DEFAULTS = {
  "primaryGlow": "#00D2FF",
  "copperAccent": "#C79F64",
  "brandBg": "#01060D",
  "formBg": "#FFFFFF"
};

const LANGS = [
  { code: 'sr', label: 'Srpski', flag: '🇷🇸' },
  { code: 'en', label: 'English', flag: '🇬🇧' },
  { code: 'de', label: 'Deutsch', flag: '🇩🇪' },
];

const LanguageSelector = ({ value, onChange }) => (
  <div className="lang-selector">
    {LANGS.map(l => (
      <button
        key={l.code}
        type="button"
        className={`lang-flag ${value === l.code ? 'active' : ''}`}
        onClick={() => onChange(l.code)}
        title={l.label}
        aria-label={l.label}
      >
        <span className="lang-flag-emoji">{l.flag}</span>
      </button>
    ))}
  </div>
);

const App = () => {
  const [mode, setMode] = React.useState('login');
  const [lang, setLang] = React.useState('sr');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--cyan', tweaks.primaryGlow);
    root.style.setProperty('--copper', tweaks.copperAccent);
    root.style.setProperty('--brand-bg', tweaks.brandBg);
  }, [tweaks.primaryGlow, tweaks.copperAccent, tweaks.brandBg]);

  return (
    <div className="auth-page minimal">
      <main className="auth-main">
        <section className="auth-left">
          <BrandingPanel />
        </section>
        <section className="auth-right">
          <FormPanel mode={mode} setMode={setMode} lang={lang} />
          <div className="lang-bar">
            <LanguageSelector value={lang} onChange={setLang} />
          </div>
        </section>
      </main>

      <TweaksPanel title="Tweaks" subtitle="Aero Ring Tech">
        <TweakSection title="Boje">
          <TweakColor label="Primarni sjaj" value={tweaks.primaryGlow} onChange={v => setTweak('primaryGlow', v)} />
          <TweakColor label="Bakarni akcent" value={tweaks.copperAccent} onChange={v => setTweak('copperAccent', v)} />
          <TweakColor label="Pozadina brenda" value={tweaks.brandBg} onChange={v => setTweak('brandBg', v)} />
        </TweakSection>
        <TweakSection title="Mod">
          <TweakButton onClick={() => setMode(m => m === 'login' ? 'register' : 'login')}>
            {mode === 'login' ? 'Prikaži registraciju →' : 'Prikaži prijavu →'}
          </TweakButton>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
</html>
